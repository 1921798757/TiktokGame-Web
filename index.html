<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<meta name="theme-color" content="#0b0f14">
		<title>TrollRunnerDouyin</title>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png">
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

		<style>
			html, body, #canvas {
				margin: 0;
				padding: 0;
				border: 0;
			}

			body {
				color: #e8f1f5;
				background: #0b0f14;
				overflow: hidden;
				touch-action: none;
				font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
			}

			#canvas {
				display: block;
				width: 100%;
				height: 100%;
				outline: none;
			}

			#loader {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				background:
					radial-gradient(circle at 50% 22%, rgba(46, 230, 168, 0.16), transparent 55%),
					radial-gradient(circle at 50% 100%, rgba(90, 130, 255, 0.14), transparent 60%),
					#0b0f14;
				z-index: 10;
				transition: opacity 0.35s ease;
			}

			#loader.done {
				opacity: 0;
				pointer-events: none;
			}

			#loader-card {
				width: min(78vw, 340px);
				text-align: center;
			}

			#title {
				font-size: 22px;
				font-weight: 700;
				letter-spacing: 0.08em;
				margin-bottom: 6px;
			}

			#subtitle {
				font-size: 12px;
				color: #7d8ca0;
				margin-bottom: 26px;
			}

			#bar-track {
				height: 6px;
				border-radius: 999px;
				background: rgba(255, 255, 255, 0.09);
				overflow: hidden;
			}

			#bar-fill {
				height: 100%;
				width: 0%;
				border-radius: 999px;
				background: linear-gradient(90deg, #7bdff2, #2ee6a8);
				transition: width 0.2s ease;
			}

			#bar-fill.indeterminate {
				width: 38%;
				animation: slide 1.2s ease-in-out infinite;
			}

			@keyframes slide {
				0% { transform: translateX(-110%); }
				100% { transform: translateX(300%); }
			}

			#stage {
				margin-top: 14px;
				font-size: 13px;
				color: #b9c8d6;
				min-height: 18px;
			}

			#detail {
				margin-top: 6px;
				font-size: 11px;
				color: #6c7c8e;
				min-height: 16px;
			}

			#notice {
				display: none;
				margin-top: 20px;
				padding: 14px;
				border-radius: 10px;
				border: 1px solid rgba(255, 96, 96, 0.45);
				background: rgba(120, 30, 40, 0.25);
				color: #ffd9d9;
				font-size: 12px;
				line-height: 1.6;
				white-space: pre-wrap;
				text-align: left;
				word-break: break-word;
			}

			#stats {
				display: none;
				position: fixed;
				left: 8px;
				bottom: 8px;
				max-width: calc(100vw - 16px);
				padding: 8px 10px;
				border-radius: 8px;
				background: rgba(0, 0, 0, 0.72);
				color: #9fe8c9;
				font: 11px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				white-space: pre;
				z-index: 11;
				pointer-events: none;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas">
			你的浏览器不支持 canvas。
		</canvas>

		<div id="loader">
			<div id="loader-card">
				<div id="title">TrollRunnerDouyin</div>
				<div id="subtitle">首次加载需要下载约 10MB 流量</div>
				<div id="bar-track"><div id="bar-fill" class="indeterminate"></div></div>
				<div id="stage">正在连接…</div>
				<div id="detail"></div>
				<div id="notice"></div>
			</div>
		</div>

		<div id="stats"></div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":378020,"index.wasm":38047590},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const loader = document.getElementById('loader');
	const barFill = document.getElementById('bar-fill');
	const stageLabel = document.getElementById('stage');
	const detailLabel = document.getElementById('detail');
	const notice = document.getElementById('notice');
	const statsBox = document.getElementById('stats');
	const showStats = new URLSearchParams(location.search).has('stats');

	const T = {
		start: performance.now(),
		firstProgress: 0,
		downloadDone: 0,
		compileMs: -1,
		startGameResolved: 0,
		firstFrame: 0,
	};

	function setStage(text, detail) {
		stageLabel.textContent = text;
		if (detail !== undefined) {
			detailLabel.textContent = detail;
		}
	}

	function fail(message) {
		notice.style.display = 'block';
		notice.textContent = String(message);
		stageLabel.textContent = '加载失败';
		barFill.classList.remove('indeterminate');
	}

	// 计时：WebAssembly 编译 / 实例化
	['instantiateStreaming', 'compileStreaming', 'compile', 'instantiate'].forEach(function (name) {
		const original = WebAssembly[name];
		if (typeof original !== 'function') {
			return;
		}
		WebAssembly[name] = function () {
			const t0 = performance.now();
			const result = original.apply(WebAssembly, arguments);
			if (result && typeof result.then === 'function') {
				result.then(function () {
					if (T.compileMs < 0) {
						T.compileMs = performance.now() - t0;
						setStage('正在编译引擎…', '已完成');
					}
				}, function () {});
			}
			return result;
		};
	});

	function resourceEntrySuffix(suffix) {
		const entries = performance.getEntriesByType('resource');
		for (let i = entries.length - 1; i >= 0; i--) {
			if (entries[i].name.indexOf(suffix) !== -1) {
				return entries[i];
			}
		}
		return null;
	}

	function buildStats() {
		const nav = performance.getEntriesByType('navigation')[0];
		const lines = [];
		const fmt = function (v) {
			return (v === undefined || v === null || v < 0) ? '-' : (Math.round(v) + 'ms');
		};
		const mb = function (v) {
			return (v === undefined || v === null) ? '-' : (v / 1048576).toFixed(2) + 'MB';
		};
		if (nav) {
			lines.push('HTML  TTFB ' + fmt(nav.responseStart - nav.startTime) + '  传输 ' + fmt(nav.responseEnd - nav.responseStart) + '  大小 ' + mb(nav.transferSize));
		}
		['index.js', 'index.wasm', 'index.pck'].forEach(function (suffix) {
			const e = resourceEntrySuffix(suffix);
			if (!e) {
				lines.push(suffix + '  未记录');
				return;
			}
			lines.push(suffix.padEnd(10) + ' 等待 ' + fmt(e.responseStart - e.startTime) +
				'  下载 ' + fmt(e.responseEnd - e.responseStart) +
				'  传输 ' + mb(e.transferSize) + ' / 解压后 ' + mb(e.decodedBodySize));
		});
		lines.push('wasm 编译+实例化 ' + fmt(T.compileMs));
		lines.push('引擎初始化(startGame) ' + fmt(T.startGameResolved - T.start));
		lines.push('首帧回调 ' + fmt(T.firstFrame - T.start) + '（总计）');
		lines.push('设备 ' + (navigator.userAgent.indexOf('Mobile') !== -1 ? 'Mobile' : 'Desktop') +
			'  DPR ' + window.devicePixelRatio +
			'  核心 ' + (navigator.hardwareConcurrency || '?') +
			'  内存 ' + (navigator.deviceMemory || '?') + 'GB' +
			'  网络 ' + ((navigator.connection && navigator.connection.effectiveType) || '?'));
		return lines.join('\n');
	}

	function showLoaderDone() {
		barFill.classList.remove('indeterminate');
		barFill.style.width = '100%';
		T.firstFrame = performance.now();
		requestAnimationFrame(function () {
			requestAnimationFrame(function () {
				loader.classList.add('done');
				setTimeout(function () { loader.remove(); }, 400);
				if (showStats) {
					statsBox.style.display = 'block';
					statsBox.textContent = buildStats();
					console.log('[load-stats]\n' + buildStats());
				}
			});
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			fail(err.message);
		} else if (typeof err === 'string') {
			fail(err);
		} else {
			fail('加载失败，请刷新重试。');
		}
	}

	const missing = Engine.getMissingFeatures({threads: GODOT_THREADS_ENABLED});
	if (missing.length !== 0) {
		fail('当前浏览器缺少运行所需能力：\n' + missing.join('\n'));
		return;
	}

	engine.startGame({
		'onProgress': function (current, total) {
			if (T.firstProgress === 0 && current > 0) {
				T.firstProgress = performance.now();
				setStage('正在下载引擎与资源…', '');
			}
			if (current > 0 && total > 0) {
				const pct = Math.min(100, current / total * 100);
				barFill.classList.remove('indeterminate');
				barFill.style.width = pct.toFixed(1) + '%';
				const elapsed = (performance.now() - T.start) / 1000;
				detailLabel.textContent = pct.toFixed(0) + '% · 已用 ' + elapsed.toFixed(1) + 's';
				if (pct >= 99.9 && T.downloadDone === 0) {
					T.downloadDone = performance.now();
					setStage('正在编译引擎…', '这一步在手机上通常需要几秒');
				}
			}
		},
	}).then(function () {
		T.startGameResolved = performance.now();
		setStage('正在进入游戏…', '');
		showLoaderDone();
	}, displayFailureNotice);
}());
		</script>
	</body>
</html>
